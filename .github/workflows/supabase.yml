name: Supabase · migraciones y funciones

# Aplica supabase/migrations y despliega supabase/functions en cada push a main.
# Solo actúa si existen los secretos del repositorio:
#   SUPABASE_ACCESS_TOKEN  (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_ID    (referencia del proyecto, p. ej. abcdefghijklmnop)
#   SUPABASE_DB_PASSWORD   (contraseña de la base de datos del proyecto)
# Hostinger construye la web aparte; este flujo no toca el sitio estático.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Comprobar secretos
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Sin SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID: no hay nada que desplegar."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest

      - name: Enlazar proyecto
        if: steps.gate.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Aplicar migraciones
        if: steps.gate.outputs.ready == 'true'
        run: supabase db push

      - name: Desplegar funciones
        if: steps.gate.outputs.ready == 'true'
        run: supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_ID"
